map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy REST + WebSocket to FastAPI.
    # Trailing slash on proxy_pass strips the /api prefix.
    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 86400s;
    }

    # Proxy manual injection endpoints to the injector service.
    # /injector/* avoids collision with the React SPA route /inject.
    # Trailing slash strips the /injector prefix → /injector/point → /point.
    location /injector/ {
        proxy_pass       http://manual-injector:8002/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # React SPA — send all unmatched routes to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
