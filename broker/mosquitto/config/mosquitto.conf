# Configuration Mosquitto — POC monitoring huile d'olive.
# Secure by design : authentification obligatoire, pas d'accès anonyme.

listener 1883

# Authentification obligatoire. Le fichier passwd doit être créé AVANT le
# premier démarrage — voir broker/mosquitto/README.md.
allow_anonymous false
password_file /mosquitto/config/passwd

# ACL — activée en Phase 5. Chaque user limité au strict nécessaire.
acl_file /mosquitto/config/aclfile

persistence true
persistence_location /mosquitto/data/
# Log to stdout — Docker captures it via `docker compose logs`
log_dest stdout
