# Orchestration du POC — monitoring qualité huile d'olive.
#
# Phase 0 : seuls le broker MQTT et la base de données sont actifs.
# Les services applicatifs sont déclarés en commentaire et activés au fil
# des phases (voir docs/roadmap.md). Une alternative plus propre, à envisager,
# est l'usage de "profiles" Compose pour activer les services par phase.

name: oliveoil-quality-poc

services:

  # --- Broker MQTT (actif dès la Phase 0) ---
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: oliveoil-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"            # MQTT — exposé en local uniquement pour le POC
    volumes:
      - ./broker/mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    networks:
      - iot-net

  # --- Base time-series (active dès la Phase 0) ---
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: oliveoil-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - timescaledb-data:/var/lib/postgresql/data
    networks:
      - backend-net

  # --- Phase 1 : simulateur de devices ---
  device-simulator:
    build: ./services/device-simulator
    container_name: oliveoil-device-simulator
    env_file: .env
    depends_on:
      - mosquitto
    networks:
      - iot-net

  # --- Phase 2 : service d'ingestion ---
  # Seul service à cheval sur les deux réseaux : point de passage contrôlé
  # entre la zone "terrain" (iot-net) et la zone back-end (backend-net).
  ingestion:
    build: ./services/ingestion
    container_name: oliveoil-ingestion
    restart: unless-stopped
    env_file: .env
    depends_on:
      - mosquitto
      - timescaledb
    networks:
      - iot-net
      - backend-net

  # --- Phase 3 : moteur de qualité ---
  quality-engine:
    build: ./services/quality-engine
    container_name: oliveoil-quality-engine
    restart: unless-stopped
    env_file: .env
    depends_on:
      - timescaledb
    networks:
      - backend-net

  # --- Phase 4 : API FastAPI ---
  api:
    build: ./services/api
    container_name: oliveoil-api
    restart: unless-stopped
    env_file: .env
    depends_on:
      - timescaledb
    ports:
      - "8000:8000"     # exposé pour tests Postman directs
    networks:
      - backend-net

  # --- Injecteur manuel (démo/apprentissage) ---
  # Publie de la télémétrie saisie à la main sur MQTT — ne touche JAMAIS la base
  # directement. L'ingestion valide comme pour tout autre émetteur (contrat
  # device-agnostique). 2e composant à cheval sur les deux réseaux, après
  # l'ingestion : affordance de démo, à restreindre/retirer en production.
  manual-injector:
    build: ./services/manual-injector
    container_name: oliveoil-manual-injector
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
      INJECTOR_MQTT_USERNAME: ${SIMULATOR_MQTT_USERNAME}
      INJECTOR_MQTT_PASSWORD: ${SIMULATOR_MQTT_PASSWORD}
      INJECTOR_SITE_ID: ${SIMULATOR_SITE_ID}
      API_AUTH_TOKEN: ${API_AUTH_TOKEN}
    depends_on:
      - mosquitto
    networks:
      - iot-net
      - backend-net

  # --- Phase 4 : Dashboard React (Nginx + proxy vers api) ---
  dashboard:
    build:
      context: ./services/dashboard
    container_name: oliveoil-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api
      - manual-injector
    networks:
      - backend-net

networks:
  iot-net:
    driver: bridge
  backend-net:
    driver: bridge

volumes:
  mosquitto-data:
  timescaledb-data:
